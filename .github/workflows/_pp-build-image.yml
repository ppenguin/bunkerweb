name: Build Single pp-dev Image (reusable)

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      dockerfile:
        required: true
        type: string

jobs:
  build:
    strategy:
      matrix:
        platform: [ubuntu-latest, ubuntu-24.04-arm]
        include:
          - platform: ubuntu-latest
            arch: amd64
          - platform: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.platform }}

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Read and sanitize version
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "tag=ppdev-dev-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "dev-${SHORT_SHA}" > src/VERSION

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          # Keep each arch image a plain single-platform image (no attestation
          # index) so the merge step below produces a clean 2-entry manifest list.
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}:${{ steps.version.outputs.tag }}-${{ matrix.arch }}
            ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}:ppdev-${{ matrix.arch }}

  # Combine the per-arch tags pushed above into a single multi-arch manifest so
  # `docker pull ghcr.io/<owner>/<image>:ppdev` resolves the right architecture.
  merge:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Compute version tag
        id: version
        run: echo "tag=ppdev-dev-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest (:ppdev and :ppdev-dev-<sha>)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:ppdev" \
            -t "${IMAGE}:${TAG}" \
            "${IMAGE}:${TAG}-amd64" \
            "${IMAGE}:${TAG}-arm64"
